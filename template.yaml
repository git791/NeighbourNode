AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NeighborNode — autonomous agent network for community fridge operations

Globals:
  Function:
    CodeUri: build_output/
    Runtime: python3.13
    Timeout: 300          # Agent chains can take up to 5 minutes
    MemorySize: 512
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref NeighborNodeTable
        AWS_REGION_NAME: !Ref AWS::Region   # use AWS_REGION_NAME to avoid collision with reserved AWS_REGION
        BEDROCK_MODEL_ID: amazon.nova-lite-v1
        BEDROCK_MODEL_ID_MICRO: amazon.nova-micro-v1
        FOOD_SAFETY_EXCLUSION_LIST: config/food_safety_exclusions.json
        SUPPORTED_LANGUAGES: "en,es"
        LOG_LEVEL: INFO
    Tracing: Active

Parameters:
  PinpointAppId:
    Type: String
    Description: Amazon Pinpoint Application ID for SMS
    Default: "mock1234567890123456789012345678"
  PinpointOriginationNumber:
    Type: String
    Description: E.164 phone number for SMS origination
    Default: "+10000000000"
  CoordinatorPhone:
    Type: String
    Description: E.164 phone number for Coordinator approval notifications
    Default: ""
  CognitoCallbackUrl:
    Type: String
    Description: Frontend URL for Cognito hosted UI callback (e.g. https://your-cloudfront-domain.cloudfront.net)
    Default: "http://localhost:5173"

Resources:
  NeighborNodeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: NeighborNodeTable
      BillingMode: PAY_PER_REQUEST    # on-demand, always-free tier at demo scale
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Cognito Auth ───────────────────────────────────────────────────────────
  # One User Pool per role group. All free-tier eligible.
  # Self-service sign-up is enabled for Host, Donor, and Runner.
  # Coordinator is admin-invite-only (PreSignUp trigger blocks self-registration).

  NeighborNodeUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: NeighborNodeUserPool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: display_name
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: transport         # for runners: bicycle, car, etc.
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      UserPoolTags:
        Project: NeighborNode

  NeighborNodeUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: NeighborNodeWebApp
      UserPoolId: !Ref NeighborNodeUserPool
      GenerateSecret: false            # SPA — no client secret
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH   # for local dev convenience
      CallbackURLs:
        - !Ref CognitoCallbackUrl
      LogoutURLs:
        - !Ref CognitoCallbackUrl
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      PreventUserExistenceErrors: ENABLED
      ReadAttributes:
        - email
        - custom:role
        - custom:display_name
        - custom:transport
        - phone_number
      WriteAttributes:
        - email
        - custom:role
        - custom:display_name
        - custom:transport
        - phone_number

  NeighborNodeUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "neighbornode-${AWS::AccountId}"
      UserPoolId: !Ref NeighborNodeUserPool

  # ── /auth Lambda — register, confirm, sign-in, profile, sign-out ──────────

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/auth_handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Cognito-backed auth — register, confirm, sign-in, profile, sign-out
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref NeighborNodeUserPool
          COGNITO_CLIENT_ID: !GetAtt NeighborNodeUserPoolClient.ClientId
      Events:
        Register:
          Type: HttpApi
          Properties:
            Path: /auth/register
            Method: POST
            ApiId: !Ref NeighborNodeApi
        Confirm:
          Type: HttpApi
          Properties:
            Path: /auth/confirm
            Method: POST
            ApiId: !Ref NeighborNodeApi
        SignIn:
          Type: HttpApi
          Properties:
            Path: /auth/signin
            Method: POST
            ApiId: !Ref NeighborNodeApi
        GetProfile:
          Type: HttpApi
          Properties:
            Path: /auth/profile
            Method: GET
            ApiId: !Ref NeighborNodeApi
        UpdateProfile:
          Type: HttpApi
          Properties:
            Path: /auth/profile
            Method: PUT
            ApiId: !Ref NeighborNodeApi
        SignOut:
          Type: HttpApi
          Properties:
            Path: /auth/signout
            Method: POST
            ApiId: !Ref NeighborNodeApi

  PdfLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: NeighborNodePdfLayer
      Description: reportlab + markdown2 for PDF report generation
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: NeighborNodePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt NeighborNodeTable.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:Converse
                Resource: "*"
              - Effect: Allow
                Action:
                  - mobiletargeting:SendMessages
                Resource: "*"
              - Effect: Allow
                Action:
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminUserGlobalSignOut
                  - cognito-idp:SignUp
                  - cognito-idp:ConfirmSignUp
                  - cognito-idp:InitiateAuth
                  - cognito-idp:GetUser
                Resource: "*"

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/webhook_handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Receives inbound SMS/webhook events and routes through the Orchestrator
      Environment:
        Variables:
          PINPOINT_APP_ID: !Ref PinpointAppId
          PINPOINT_ORIGINATION_NUMBER: !Ref PinpointOriginationNumber
          COORDINATOR_PHONE: !Ref CoordinatorPhone
      Events:
        InboundWebhook:
          Type: HttpApi
          Properties:
            Path: /inbound
            Method: POST
            ApiId: !Ref NeighborNodeApi

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/dashboard_handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Returns live dashboard state for the coordinator frontend
      Layers:
        - !Ref PdfLayer
      Events:
        GetDashboard:
          Type: HttpApi
          Properties:
            Path: /dashboard
            Method: GET
            ApiId: !Ref NeighborNodeApi
        GetReport:
          Type: HttpApi
          Properties:
            Path: /report
            Method: GET
            ApiId: !Ref NeighborNodeApi

  ApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/approval_handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Handles Coordinator approve/reject actions from the dashboard
      Environment:
        Variables:
          PINPOINT_APP_ID: !Ref PinpointAppId
          PINPOINT_ORIGINATION_NUMBER: !Ref PinpointOriginationNumber
          COORDINATOR_PHONE: !Ref CoordinatorPhone
      Events:
        ApproveItem:
          Type: HttpApi
          Properties:
            Path: /approve
            Method: POST
            ApiId: !Ref NeighborNodeApi
        RejectItem:
          Type: HttpApi
          Properties:
            Path: /reject
            Method: POST
            ApiId: !Ref NeighborNodeApi

  ActionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/action_handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Handles web app actions (offer, fridge status, dispatch)
      Environment:
        Variables:
          FOOD_SAFETY_EXCLUSION_LIST: config/food_safety_exclusions.json
      Events:
        PostOffer:
          Type: HttpApi
          Properties:
            Path: /offer
            Method: POST
            ApiId: !Ref NeighborNodeApi
        FridgeEmpty:
          Type: HttpApi
          Properties:
            Path: /fridge/empty
            Method: POST
            ApiId: !Ref NeighborNodeApi
        FridgeLow:
          Type: HttpApi
          Properties:
            Path: /fridge/low
            Method: POST
            ApiId: !Ref NeighborNodeApi
        FridgeUpdate:
          Type: HttpApi
          Properties:
            Path: /fridge/update
            Method: POST
            ApiId: !Ref NeighborNodeApi
        DispatchComplete:
          Type: HttpApi
          Properties:
            Path: /dispatch/complete
            Method: POST
            ApiId: !Ref NeighborNodeApi

  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/scheduler_handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Triggered by EventBridge every 2 hours to run Forecast Agent
      Events:
        ForecastSchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(2 hours)"
            Description: Runs Forecast Agent every 2 hours

  NeighborNodeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: NeighborNode API — inbound webhooks + dashboard state
      CorsConfiguration:
        AllowOrigins:
          - "*"           # Restrict to your Amplify domain in production
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

Outputs:
  ApiBaseUrl:
    Description: "API Gateway base URL — copy this into frontend/.env.local as VITE_API_BASE_URL"
    Value: !Sub "https://${NeighborNodeApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: NeighborNodeApiBaseUrl

  DynamoTableName:
    Description: "DynamoDB table name"
    Value: !Ref NeighborNodeTable
    Export:
      Name: NeighborNodeTableName

  CognitoUserPoolId:
    Description: "Cognito User Pool ID — copy to frontend/.env.local as VITE_COGNITO_USER_POOL_ID"
    Value: !Ref NeighborNodeUserPool
    Export:
      Name: NeighborNodeUserPoolId

  CognitoClientId:
    Description: "Cognito App Client ID — copy to frontend/.env.local as VITE_COGNITO_CLIENT_ID"
    Value: !GetAtt NeighborNodeUserPoolClient.ClientId
    Export:
      Name: NeighborNodeClientId

  CognitoHostedUiUrl:
    Description: "Cognito Hosted UI base URL (for OAuth flows)"
    Value: !Sub "https://neighbornode-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: NeighborNodeHostedUiUrl
