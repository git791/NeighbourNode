[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "neighbornode"
version = "0.1.0"
description = "Autonomous agent network for community fridge and mutual-aid operations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1.0",
    "boto3>=1.34.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "geopy>=2.4.1",
    "reportlab>=4.2.0",
    "markdown2>=2.4.13",
]

[project.scripts]
# Run the local demo: neighbornode-run --seed data/seed_demo.json
neighbornode-run = "neighbornode.local_runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neighbornode*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
